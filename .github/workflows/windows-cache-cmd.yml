name: Verify archived cache command launchers on Windows
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cmd:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    env:
      # The distributed .cmd files invoke "py -3" when the launcher exists.
      PY_PYTHON3: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify and unpack the archive the skill ships
        shell: python
        run: |
          # The archive whose SHA-256 the skill's wrapper names, so the launchers and code tested below are
          # exactly the distributed ones.
          import hashlib, os, re, tarfile
          archive = os.path.join("hololive-wiki", "cache", "hololive_wiki_person_cache.tar.xz")
          with open(os.path.join("hololive-wiki", "scripts", "hololive_cache.py"), encoding="utf-8") as stream:
              expected = re.search(r'^ARCHIVE_SHA256 = "([0-9a-f]{64})"$', stream.read(), re.M).group(1)
          with open(archive, "rb") as stream:
              actual = hashlib.sha256(stream.read()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Archive checksum mismatch: {actual}, the wrapper names {expected}")
          with tarfile.open(archive, "r:xz") as tar:
              tar.extractall(os.environ["RUNNER_TEMP"], **({"filter": "data"} if hasattr(tarfile, "data_filter") else {}))
      - name: Confirm the command launcher selects the matrix Python
        shell: pwsh
        run: |
          $actual = py -3 -c "import sys; print(str(sys.version_info.major) + '.' + str(sys.version_info.minor))"
          if ($actual -ne '${{ matrix.python }}') { throw "py -3 selected $actual; expected ${{ matrix.python }}" }
      - name: The shipped launchers are the builder's
        shell: python
        working-directory: ${{ runner.temp }}/hololive_wiki_person_cache
        run: |
          import sys
          from pathlib import Path
          sys.dont_write_bytecode = True
          sys.path.insert(0, ".")
          import build_fast_cache
          differ = [name for name, script in build_fast_cache.WINDOWS_LAUNCHERS.items()
                    if Path(name).read_bytes() != script.replace("\n", "\r\n").encode("ascii")]
          if differ:
              raise SystemExit(f"Shipped launchers differ from the builder's: {differ}")
          print("launchers:", ", ".join(sorted(build_fast_cache.WINDOWS_LAUNCHERS)))
      - name: Execute the shipped CMD launchers through cmd.exe
        shell: python
        working-directory: ${{ runner.temp }}/hololive_wiki_person_cache
        run: |
          import sys, unittest
          sys.dont_write_bytecode = True
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_windows_launchers.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < 6:
              raise SystemExit("Windows launcher tests failed, were skipped or did not run")
      - name: Run the shipped selftest.cmd (verify, then every offline test)
        shell: cmd
        working-directory: ${{ runner.temp }}/hololive_wiki_person_cache
        run: call selftest.cmd
